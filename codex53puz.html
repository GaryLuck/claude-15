<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic 15-Tile Puzzle</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --frame: #7b5e3c;
      --tile: #d8b98c;
      --tile-border: #8a6a44;
      --text: #2c2218;
      --accent: #5a3f27;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fffdf7, var(--bg));
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
    }

    .game {
      width: min(92vw, 460px);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 2rem;
      letter-spacing: 0.03em;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 14px;
      font-size: 1rem;
    }

    .frame {
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(160deg, #9a7a53, var(--frame));
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #6a4d30;
      padding: 8px;
      border-radius: 8px;
    }

    .tile {
      border: 2px solid var(--tile-border);
      border-radius: 8px;
      background: linear-gradient(155deg, #ebcfaa, var(--tile));
      color: var(--text);
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 700;
      display: grid;
      place-items: center;
      user-select: none;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.1s ease;
    }

    .tile:hover { filter: brightness(1.05); }
    .tile:active { transform: scale(0.97); }

    .empty {
      background: #5e462e;
      border-style: dashed;
      cursor: default;
      filter: none;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #3f2f1f;
      background: linear-gradient(180deg, #fff6e8, #dbc39f);
      color: #2f2318;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.03); }
    button:active { transform: translateY(1px); }

    #message {
      min-height: 1.4em;
      margin-top: 10px;
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>15-Tile Puzzle</h1>
    <div class="stats">
      <div>Moves: <strong id="moves">0</strong></div>
      <div>Time: <strong id="time">0:00</strong></div>
    </div>

    <div class="frame">
      <div id="board" aria-label="15 tile puzzle board"></div>
    </div>

    <div class="controls">
      <button id="shuffleBtn" type="button">Shuffle</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const SIZE = 4;
    const TOTAL = SIZE * SIZE;
    const SOLVED = Array.from({ length: TOTAL }, (_, i) => (i + 1) % TOTAL);

    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const resetBtn = document.getElementById("resetBtn");

    let tiles = [...SOLVED];
    let moves = 0;
    let timer = null;
    let start = null;

    function isSolved() {
      return tiles.every((n, i) => n === SOLVED[i]);
    }

    function isSolvable(arr) {
      const nums = arr.filter((n) => n !== 0);
      let inversions = 0;
      for (let i = 0; i < nums.length; i++) {
        for (let j = i + 1; j < nums.length; j++) {
          if (nums[i] > nums[j]) inversions++;
        }
      }
      const emptyRowIndex = Math.floor(arr.indexOf(0) / SIZE);
      const emptyRowFromBottom = SIZE - emptyRowIndex;
      return (emptyRowFromBottom + inversions) % 2 === 1;
    }

    function shuffleTiles() {
      do {
        tiles = [...SOLVED];
        for (let i = tiles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
      } while (!isSolvable(tiles) || isSolved());
    }

    function stopTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function resetStats() {
      stopTimer();
      moves = 0;
      start = null;
      movesEl.textContent = "0";
      timeEl.textContent = "0:00";
      messageEl.textContent = "";
    }

    function startTimer() {
      if (timer) return;
      start = Date.now();
      timer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - start) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        timeEl.textContent = `${mins}:${String(secs).padStart(2, "0")}`;
      }, 250);
    }

    function draw() {
      board.innerHTML = "";
      tiles.forEach((value, index) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = value === 0 ? "tile empty" : "tile";
        tile.textContent = value === 0 ? "" : String(value);
        tile.setAttribute("aria-label", value === 0 ? "Empty tile" : `Tile ${value}`);
        if (value === 0) tile.disabled = true;
        tile.addEventListener("click", () => moveTile(index));
        board.appendChild(tile);
      });
    }

    function trySolveMessage() {
      if (!isSolved()) return;
      stopTimer();
      messageEl.textContent = `Solved in ${moves} moves!`;
    }

    function moveTile(index) {
      const emptyIndex = tiles.indexOf(0);
      const row = Math.floor(index / SIZE);
      const col = index % SIZE;
      const emptyRow = Math.floor(emptyIndex / SIZE);
      const emptyCol = emptyIndex % SIZE;
      const adjacent = (Math.abs(row - emptyRow) === 1 && col === emptyCol) || (Math.abs(col - emptyCol) === 1 && row === emptyRow);
      if (!adjacent) return;

      startTimer();
      [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
      moves++;
      movesEl.textContent = String(moves);
      draw();
      trySolveMessage();
    }

    function startGame() {
      resetStats();
      shuffleTiles();
      draw();
    }

    function resetGame() {
      resetStats();
      tiles = [...SOLVED];
      draw();
    }

    document.addEventListener("keydown", (event) => {
      const emptyIndex = tiles.indexOf(0);
      const row = Math.floor(emptyIndex / SIZE);
      const col = emptyIndex % SIZE;
      let target = -1;

      if (event.key === "ArrowUp" && row < SIZE - 1) target = emptyIndex + SIZE;
      if (event.key === "ArrowDown" && row > 0) target = emptyIndex - SIZE;
      if (event.key === "ArrowLeft" && col < SIZE - 1) target = emptyIndex + 1;
      if (event.key === "ArrowRight" && col > 0) target = emptyIndex - 1;

      if (target !== -1) {
        event.preventDefault();
        moveTile(target);
      }
    });

    shuffleBtn.addEventListener("click", startGame);
    resetBtn.addEventListener("click", resetGame);

    startGame();
  </script>
</body>
</html>
